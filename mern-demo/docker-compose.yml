version: '3.8'
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: mern-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
    - MONGODB_URI=mongodb://mongodb:27017/mern_db

  frontend:
    image: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data: